# Phase 6E: the go-live smoke check against the live site every 6 hours (and on demand from the
# Actions tab). Logged-out requests to public addresses only, no secrets; the log shows status codes
# and check names, never page content. A failed run makes GitHub email the repository owner.
# Scheduled runs happen only from main, and GitHub pauses them after 60 days without repository
# activity (re-enable from the Actions tab).
name: Live check

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/vault/live-check.mjs
      - .github/workflows/live-check.yml

permissions:
  contents: read

concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  live:
    name: Live site responds as expected
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check https://kaushik-kamal.vercel.app
        run: node scripts/vault/live-check.mjs
