# Phase 6C: checks on every push and pull request. No secrets: the browser tests run against the
# synthetic fixture (fake Supabase, Google and Gemini on 127.0.0.1) and the SQL suites run in an
# offline disposable Postgres. Nothing here contacts Supabase, Google, Gemini or Vercel, and nothing
# deploys. This repository is public, so its logs and artifacts are public too.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Types, lint, unit tests, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # tests/profile.test.mjs compares with the homepage text in an earlier commit (ac3e2f9).
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # next-env.d.ts and the route helper types (LayoutProps, PageProps) are generated, not
      # committed; a fresh checkout needs them before the type check.
      - name: Generate Next types
        run: npx next typegen
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Audit (production dependencies, high and above)
        run: npm audit --omit=dev --audit-level=high

  sql:
    name: Database suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Migrations and SQL suites (offline Postgres)
        run: node scripts/vault/run-sql-suites.mjs

  browser:
    name: Build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # Builds the production app against the fixture (tests/browser/app-server.mjs), then runs every
      # spec: features, the enforced CSP, accessibility and the homepage byte budget.
      - name: Browser tests
        run: npm run test:browser
      - name: Keep failure screenshots and traces (synthetic data only)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
